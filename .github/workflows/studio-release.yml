name: Studio Release

# The channel comes from apps/studio/package.json's version: a prerelease tag
# (0.2.0-beta.0) publishes to beta, a plain version publishes to stable. Bump
# the version in a commit first, then run this.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` — the root package.json's `packageManager` field pins it,
      # and specifying both makes the action error out. Matches ci.yml / pr.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Signing certs live in the shared apple-certificates match repo (the same
      # one Argus reads) — a Developer ID cert is per-team, so there's nothing
      # Studio-specific to issue. Installed into a throwaway keychain here
      # because electron-builder signs from the keychain, not from a file.
      # The runner image's default bundler is 1.17.2, which cannot run on its
      # Ruby 3.3 at all: it calls String#untaint, removed in Ruby 3.2. Pin our
      # own Ruby and a modern bundler instead of inheriting the image's.
      # bundler-cache also runs `bundle install`, so fastlane lands here.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/studio

      - name: Create build keychain
        env:
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          # Prepend build.keychain to the search list so match can find installed certs
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain

      - name: Encode match git auth
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          # match needs base64("user:token") for the HTTPS Authorization header.
          # Store the raw PAT as a secret and encode it here so rotation is trivial.
          AUTH=$(printf '%s' "x-access-token:${MATCH_GIT_PAT}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Sync Developer ID cert
        working-directory: apps/studio
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          CI: "true"
        run: bundle exec fastlane match developer_id --readonly

      # electron-builder wants the App Store Connect key as a file path, so the
      # key body is stored as a secret and written to disk here. A path on its
      # own would be meaningless — the runner is fresh every time.
      - name: Materialize App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve version and channel
        run: |
          VERSION=$(node -p "require('./apps/studio/package.json').version")
          CHANNEL=$(node -p "/^\\d+\\.\\d+\\.\\d+-([a-z]+)/.exec('${VERSION}')?.[1] ?? 'latest'")
          echo "Releasing Conductor Studio ${VERSION} as studio-v${VERSION} (${CHANNEL} channel)" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract release notes
        run: |
          # Top section of apps/studio/CHANGELOG.md — everything between the
          # first '## ' heading and the next. Written by `changeset version`
          # during a CLI release, which bumps conductor-studio too.
          awk '
            /^## / { if (found) exit; found=1; next }
            found { print }
          ' apps/studio/CHANGELOG.md > studio-release-notes.md 2>/dev/null || true
          if [ -s studio-release-notes.md ]; then
            echo "STUDIO_RELEASE_NOTES_FILE=$GITHUB_WORKSPACE/studio-release-notes.md" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG section found — release body will be the default." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Create the tag before packaging. electron-builder publishes the dmg and
      # the zip concurrently, and each asks GitHub to create the release; with
      # no tag yet, the losing request dies on "Published releases must have a
      # valid tag" mid-upload, leaving a release missing artifacts. With the tag
      # already present there is nothing to race over.
      - name: Create the release tag
        run: |
          VERSION=$(node -p "require('./apps/studio/package.json').version")
          TAG="studio-v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "Created ${TAG}."
          fi

      - name: Build Studio
        run: pnpm --filter conductor-studio build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # --publish never, then upload with gh. electron-builder uploads the dmg
      # and the zip concurrently and exited once while the zip was still in
      # flight, producing a release whose channel manifest pointed at a file
      # that was never there — and still reporting success. The channel yml is
      # written to release/ either way, so nothing is lost by publishing it
      # ourselves and checking the result.
      - name: Package, sign, and notarize
        working-directory: apps/studio
        run: pnpm electron-builder --config electron-builder.release.cjs --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing: the bare common name — electron-builder adds the
          # "Developer ID Application:" prefix and rejects values that already
          # have it. Auto-discovery must stay on or electron-builder ignores the
          # keychain and looks for CSC_LINK instead.
          CSC_NAME: Douwe Bos (CKZT75PN5T)
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_KEYCHAIN: build.keychain
          # Notarization: APPLE_API_KEY is the path exported into $GITHUB_ENV by
          # the "Materialize App Store Connect API key" step.
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}

      - name: Publish the release
        working-directory: apps/studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="studio-v${VERSION}"
          CHANNEL=$(node -p "/^\\d+\\.\\d+\\.\\d+-([a-z]+)/.exec('${VERSION}')?.[1] ?? 'latest'")

          ASSETS=(
            "release/conductor-studio-${VERSION}-arm64.dmg"
            "release/conductor-studio-${VERSION}-arm64.dmg.blockmap"
            "release/conductor-studio-${VERSION}-arm64.zip"
            "release/conductor-studio-${VERSION}-arm64.zip.blockmap"
            "release/${CHANNEL}-mac.yml"
          )
          for f in "${ASSETS[@]}"; do
            [ -f "$f" ] || { echo "::error::electron-builder did not produce $f"; exit 1; }
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            ARGS=(--title "Studio v${VERSION}")
            [ "$CHANNEL" != "latest" ] && ARGS+=(--prerelease)
            [ -n "${STUDIO_RELEASE_NOTES_FILE:-}" ] && ARGS+=(--notes-file "$STUDIO_RELEASE_NOTES_FILE")
            [ -n "${STUDIO_RELEASE_NOTES_FILE:-}" ] || ARGS+=(--generate-notes)
            gh release create "$TAG" "${ARGS[@]}" "${ASSETS[@]}"
          fi

          # A leftover draft from an earlier attempt is reused by the upload
          # branch above, and a draft is invisible to electron-updater and to
          # the houwert.dev proxy alike. Force it published.
          PRERELEASE=true
          [ "$CHANNEL" = "latest" ] && PRERELEASE=false
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"

      # A release whose manifest names a file that never uploaded looks fine
      # from the outside, so assert every artifact actually landed.
      - name: Verify every artifact landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/studio/package.json').version")
          TAG="studio-v${VERSION}"
          CHANNEL=$(node -p "/^\\d+\\.\\d+\\.\\d+-([a-z]+)/.exec('${VERSION}')?.[1] ?? 'latest'")
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.state == "uploaded") | .name' > uploaded.txt
          FAILED=0
          for name in \
            "conductor-studio-${VERSION}-arm64.dmg" \
            "conductor-studio-${VERSION}-arm64.zip" \
            "${CHANNEL}-mac.yml"; do
            if grep -qx "$name" uploaded.txt; then
              echo "  ok       $name"
            else
              echo "::error::$name is missing from ${TAG}"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Notify houwert.dev to sync changelogs
        # Same repository_dispatch the CLI release fires — houwert.dev's
        # `Sync changelogs` workflow regenerates its JSON (which now includes
        # apps/studio/CHANGELOG.md) and commits, triggering a Pages rebuild so
        # the Studio page's version badge and changelog match this release.
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping website notify"
            exit 0
          fi
          VERSION=$(node -p "require('./apps/studio/package.json').version")
          gh api repos/DouweBos/houwert.dev/dispatches \
            --method POST \
            -f event_type=upstream-release \
            -F "client_payload[product]=studio" \
            -F "client_payload[version]=${VERSION}"
          echo "Notified houwert.dev of studio v${VERSION}"
