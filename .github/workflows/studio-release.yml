name: Studio Release

# The channel comes from apps/studio/package.json's version: a prerelease tag
# (0.2.0-beta.0) publishes to beta, a plain version publishes to stable. Bump
# the version in a commit first, then run this.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` — the root package.json's `packageManager` field pins it,
      # and specifying both makes the action error out. Matches ci.yml / pr.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve version and channel
        run: |
          VERSION=$(node -p "require('./apps/studio/package.json').version")
          CHANNEL=$(node -p "/^\\d+\\.\\d+\\.\\d+-([a-z]+)/.exec('${VERSION}')?.[1] ?? 'latest'")
          echo "Releasing Conductor Studio ${VERSION} as studio-v${VERSION} (${CHANNEL} channel)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Studio
        run: pnpm --filter conductor-studio build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Package, sign, notarize, and publish
        working-directory: apps/studio
        run: pnpm electron-builder --config electron-builder.release.cjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing: the Developer ID cert must be present in the keychain
          # (e.g. installed via Fastlane match in a prior step).
          CSC_NAME: ${{ secrets.STUDIO_CSC_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # Notarization via App Store Connect API key.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
