name: Studio Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: latest
        options:
          - latest
          - beta

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Studio
        run: pnpm --filter conductor-studio build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Package, sign, notarize, and publish
        working-directory: apps/studio
        run: pnpm electron-builder --config electron-builder.release.cjs --publish always
        env:
          STUDIO_CHANNEL: ${{ github.event.inputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing: the Developer ID cert must be present in the keychain
          # (e.g. installed via Fastlane match in a prior step).
          CSC_NAME: ${{ secrets.STUDIO_CSC_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          # Notarization via App Store Connect API key.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
